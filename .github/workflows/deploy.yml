name: Deploy

# Собирает сайт из исходников ветки main и публикует результат в gh-pages.
# Ветка main — только исходный код, gh-pages — только собранная статика.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      # Сборка сама раскладывает ru/index.html, en/index.html, 404.html,
      # sitemap.xml и robots.txt — отдельный шаг для них не нужен.
      - name: Build
        run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R dist/. _site/
          # Отключаем Jekyll, иначе GitHub Pages прячет файлы, начинающиеся с _
          touch _site/.nojekyll

      - name: Publish to gh-pages
        working-directory: _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA:0:7}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
